    <!-- URL: https://www.google.com/search?q=kartik+mathur -->
    <form action="https://www.google.com/search" method="GET">
        <input name="q" type="text" placeholder="Search on Google">
        <button>Search Google</button>
    </form>

    <!-- URL: https://www.bing.com/search?q=kartik+mathur -->
    <form action="https://www.bing.com/search" method="GET">

        <button>Search Bing</button>
    </form>
