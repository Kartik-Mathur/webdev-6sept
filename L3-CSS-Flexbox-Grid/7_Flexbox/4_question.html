<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            height: 700px;
            width: 1100px;
            border: 5px solid black;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
        }

        .sidebar,
        .main{
            height: 95%;
        }

        .sidebar{
            width: 30%;
            background-color: lightblue;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            border: 1px solid black;
        }

        .main{
            width: 65%;
        }
        
        .div1,
        .div2{
            border: 1px solid black;
        }

        .div1{
            height:20%;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .div2{
            height: 75%;
            display: flex;
            align-items: center;
            justify-content: space-around;
            margin-top: 10px;
        }

        .box{
            height: 50px;
            width: 125px;
            background-color: yellow;
            border: 1px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
        }
        
        .progress,
        .activity{
            height: 90%;
            width: 40%;
            background-color: green;
        }

        div{
            border-radius: 8px;
        }
    </style>
</head>

<body>


    <div class="container">
        <div class="sidebar">SIDEBAR</div>
        <div class="main">
            <div class="div1">
                <div class="box diva">A</div>
                <div class="box divb">B</div>
                <div class="box divc">C</div>
            </div>
            <div class="div2">
                <div class="progress"></div>
                <div class="activity"></div>
            </div>
        </div>
    </div>
</body>

</html>
