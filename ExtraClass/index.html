<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Head tag stores metadata -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn HTML</title>
</head>

<body>
    <!-- These are our heading tags -->
    <h1>Heading 1</h1>
    <h2>Heading 2</h2>
    <h3>Heading 3</h3>
    <h4>Heading 4</h4>
    <h5>Heading 5</h5>
    <h6>Heading 6</h6>

    <!--
     There are 2 type of HTML elements
     1. Block Elements (div)
     2. Inline Elements (span)
    -->

    <!-- Block elements viewport ki poori width occupy karte hai -->
    <div>I am a div and I am a block element-1</div>
    <div>I am a div and I am a block element-2</div>

    <!-- Inline elements utni hi space lete hai jitni needed hai -->
    <span>I am a span and I am an Inline element-1</span>
    <span>I am a span and I am an Inline element-2</span>
