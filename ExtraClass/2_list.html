<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>

<body>

    <!-- 
    list are of 2 types:
     1. unordered list -> <ul></ul>
     2. ordered list -> <ol></ol>
    -->
    <!-- 
    There are attributes that are associated with ul tags
    "attributes" are written inside the opening tag of HTML elements
    For example: type is an attribute of ul
    type=""
      Options: circle, square, disc(default value)
       -->
    <ul type="disc">
        Movies
        <li>Hulk</li>
        <li>Ironman</li>
        <li>Thor</li>
        <li>Superman</li>
    </ul>

    <!-- ordered list -->
     <!-- attributes:
       1. type
       2. start(this is always a number)
       -->
    <ol type="1" start="3">
        Movies
        <li>Hulk</li>
        <li>Ironman</li>
        <li>Thor</li>
        <li>Superman</li>
    </ol>

</body>

</html>
