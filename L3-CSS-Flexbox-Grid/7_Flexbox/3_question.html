<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            height: 80px;
            border: 5px solid black;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo{
            width: 120px;
            height: 50px;
            border: 2px solid black;
            font-size: 30px;
            margin-left: 40px;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .navbar{
            width: 40%;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            font-size: 30px;
        }
        
        .navlink:link,
        .navlink:visited{
            color: black;
            text-decoration: none;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="item logo" style="background-color: lightcoral;">LOGO</div>
        <nav class="item navbar">
            <a class="navlink" href="#">Home</a>
            <a class="navlink" href="#">About</a>
            <a class="navlink" href="#">Courses</a>
            <a class="navlink" href="#">Contact</a>
        </nav>
    </div>
</body>
</html>
