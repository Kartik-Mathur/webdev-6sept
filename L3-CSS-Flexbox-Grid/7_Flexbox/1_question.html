<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: flex;
            height: 700px;
            border: 5px solid black;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .item{
            height: 120px;
            width: 120px;
            border: 2px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 27px;
        }
    </style>
</head>
<body>
    
    <div class="container">
        <div class="item one">1</div>
        <div class="item two">2</div>
        <div class="item three">3</div>
    </div>
</body>
</html>
