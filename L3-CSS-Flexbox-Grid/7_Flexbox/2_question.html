<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            height: 700px;
            border: 5px solid black;
            display: flex;
            justify-content: space-around;
        }

        .item{
            width: 120px;
            height: 120px;
            border: 2px solid black;
            font-size: 30px;
        }

        .item-1,
        .item-3{
            align-self: center;
        }

        .item-4{
            align-self: flex-end;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item item-1" style="background-color: lightcoral;">1</div>
        <div class="item item-2" style="background-color: lightgreen;">2</div>
        <div class="item item-3" style="background-color: lightsalmon;">3</div>
        <div class="item item-4" style="background-color: lightseagreen;">4</div>
    </div>
</body>
</html>
