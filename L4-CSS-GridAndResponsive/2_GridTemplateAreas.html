<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .container{
            height: 500px;
            width: 600px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: 1fr 1.5fr;

            grid-template-areas: 
            "item1 item2 item3"
            "item1 item4 item4";
        }

        .item1{
            grid-area: item1;
        }

        .item2{
            grid-area: item2;
        }

        .item3{
            grid-area: item3;
        }

        .item4{
            grid-area: item4;
        }

        .item,
        .container{
            border: 1px solid black;
        }
    </style>
</head>
<body>
    
     <div class="container">
        <div class="item item1">1</div>
        <div class="item item2">2</div>
        <div class="item item3">3</div>
        <div class="item item4">4</div>
    </div>

</body>
</html>
