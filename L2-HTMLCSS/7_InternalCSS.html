<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Here we can write internal css */
        div {
            font-size: 28px;
        }

        .dog {
            color: burlywood;
        }

        /* Class ke upar css lagana is done via dot operator */
        .animal {
            color: yellow;
            background-color: black;
        }

        /* id ke liye we use # */
        #elephant {
            color: orange;
        }
    </style>
</head>

<body>

    <div class="animal cat">
        I am a Cat
    </div>

    <div class="animal dog">
        I am a Dog
    </div>

    <div id="elephant" class="animal elephant">
        I am an Elephant
    </div>
</body>

</html>
